[project]
name = "sdai2026-agentic-lab"
version = "1.0.0"
description = "Hands-on lab: building agentic AI systems with local LLMs (Ollama + LangChain + LangGraph)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-ollama>=1.0",
    "langgraph>=1.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]
